*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#26262a;color:var(--tx);font:400 16px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);-webkit-tap-highlight-color:transparent}
body.has-player{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 88px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:#26262a;background-image:var(--bgimg),var(--bgimg);background-repeat:no-repeat;background-position:center top,center bottom;background-size:cover,cover;background-blend-mode:lighten}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.fl{fill:currentColor}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:24px;height:24px}
.ib:hover{background:rgba(255,255,255,.07)}
.dk{display:none}

/* навигация */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(38,38,42,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--s2)}
.brand{display:none}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mu)}
.navb svg{width:24px;height:24px}
.navb[aria-current=page]{color:var(--ac)}

/* страницы */
main{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
h1.h{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:12px 0}
h2.sec{font-size:20px;font-weight:700;margin:24px 0 12px}
.note{color:var(--mu);padding:16px 0;margin:0}
.foot{font-size:13px;padding-top:24px}
.mu{color:var(--mu)}
.nm,.ar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-weight:500}
.ar{color:var(--mu);font-size:14px}
.du{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}

/* списки треков */
.row{display:flex;align-items:center;border-radius:12px}
.row:hover{background:var(--s1)}
.pl{flex:1;min-width:0;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:6px 4px 6px 6px;text-align:left}
.cv{width:52px;height:52px;border-radius:8px;background:var(--s2);object-fit:cover;display:block}
.mt{min-width:0}
.row.on .nm{color:var(--ac)}
.fav{color:var(--mu)}
.fav.on{color:var(--hot)}
.fav.on svg{fill:currentColor}
.mo{color:var(--mu)}

/* Моя музыка */
.hero{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:linear-gradient(135deg,#ffc20e 0%,#d49e00 50%,#6a6a72 100%);background:linear-gradient(135deg,var(--ac) 0%,color-mix(in srgb,var(--ac) 82%,#000) 50%,#6a6a72 100%);color:var(--on);cursor:pointer;width:100%;text-align:left}
.hero .ht{flex:1;min-width:0}
.hero .t1{font-size:22px;font-weight:700}
.hero .t2{opacity:.8;font-size:14px}
.hero .pbtn{background:var(--on);color:var(--ac)}
.mbrand{font-weight:700;color:var(--ac);letter-spacing:.02em;margin-top:8px}
.shp{margin:0;padding:0 12px 10px;color:var(--mu);font-size:14px;line-height:1.45}
.pbtn{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;flex:none}
.pbtn svg{width:28px;height:28px}
.car{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cd{flex:none;width:128px;text-align:left}
.cd .cv{width:128px;height:128px;border-radius:12px;margin-bottom:6px}
.empty{padding:32px 8px;text-align:center;color:var(--mu)}
.empty svg{width:48px;height:48px;opacity:.5}

/* Поиск */
.sbar{position:sticky;top:0;z-index:4;background:rgba(38,38,42,.75);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px}
.sin{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--s1);border-radius:14px;color:var(--mu)}
.sin svg{width:22px;height:22px;flex:none}
.sin input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--tx);outline:0}
.sin input::placeholder{color:var(--mu)}
.sin:focus-within{box-shadow:0 0 0 2px var(--ac)}
.genres{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gn{height:84px;border-radius:16px;padding:12px;text-align:left;font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25);display:flex;align-items:flex-end;transition:transform .15s}
.gn:hover{transform:scale(1.02)}
.gh{display:flex;align-items:center;gap:4px;margin:8px 0 4px}
.gh h2{margin:0;font-size:22px}

/* Ещё */
.card{background:var(--s1);border-radius:16px;padding:16px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:20px}
.card p{margin:0 0 12px}
.fld{width:100%;height:46px;border-radius:12px;border:0;background:var(--s2);color:var(--tx);padding:0 14px;margin:4px 0 8px;outline:0}
.fld:focus{box-shadow:0 0 0 2px var(--ac)}
.lbl{font-size:13px;color:var(--mu)}
.btn{height:44px;padding:0 20px;border-radius:12px;background:var(--ac);color:var(--on);font-weight:500;margin:8px 8px 0 0}
.btn.alt{background:var(--s2);color:var(--tx)}
.btn.dg{background:var(--s2);color:var(--hot)}
.prof{display:flex;align-items:center;gap:16px;padding:16px;background:var(--s1);border-radius:16px;margin:12px 0 16px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#9a7400);color:var(--on);display:grid;place-items:center;font-size:28px;font-weight:700;flex:none}
.mrow{display:flex;align-items:center;width:100%;padding:14px 12px;border-radius:12px;text-align:left;gap:12px}
.mrow:hover{background:var(--s1)}
.mrow .mt{flex:1}
.mrow .c2{color:var(--mu);display:grid}
.mrow .c2 svg{width:20px;height:20px}
.sh2{display:flex;align-items:center;gap:4px;margin-left:-8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--s2)}
.kv:last-child{border:0}
.pcv{width:52px;height:52px;border-radius:8px;background:var(--s2);overflow:hidden;display:grid;place-items:center;color:var(--mu);flex:none}
.pcv img{width:100%;height:100%;object-fit:cover}
.pcv svg{width:26px;height:26px}
.acts{display:flex;flex-wrap:wrap;margin:8px 0 12px}

/* мини-плеер */

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const st={
  g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const S=p=>'<svg viewBox="0 0 24 24" class="st" aria-hidden="true">'+p+'</svg>';
const F=p=>'<svg viewBox="0 0 24 24" class="fl" aria-hidden="true">'+p+'</svg>';
const REP='<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>';
const IC={
  play:F('<path d="M8 5v14l11-7z"/>'),
  pause:F('<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'),
  next:F('<path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/>'),
  prev:F('<path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/>'),
  heart:S('<path d="M12 20.5l-1.4-1.3C5.4 14.5 2 11.4 2 7.6 2 4.5 4.4 2.5 7 2.5c1.7 0 3.4.8 5 2.6 1.6-1.8 3.3-2.6 5-2.6 2.6 0 5 2 5 5.1 0 3.8-3.4 6.9-8.6 11.6z"/>'),
  shuf:S('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),
  rep:S(REP),
  rep1:S(REP+'<path d="M11 10.5l1.5-1v5.5"/>'),
  vol:S('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>'),
  mute:S('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'),
  down:S('<path d="M6 9l6 6 6-6"/>'),
  up:S('<path d="M6 15l6-6 6 6"/>'),
  back:S('<path d="M15 5l-7 7 7 7"/>'),
  chev:S('<path d="M9 5l7 7-7 7"/>'),
  dots:F('<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>'),
  note:S('<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'),
  search:S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  more:F('<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>'),
  globe:S('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>')
};

const VER='0.0.13'; /* номер обновления: показывается внизу вкладки «Ещё»; при выпуске обновления меняйте здесь и в sw.js */
/* ---------- встроенный каталог (сейчас пуст: в плеере только ваши файлы) ----------
   Чтобы добавить трек, допишите объект в CATALOG_SRC:
   {title:'Название',artist:'Исполнитель',file:'https://…/трек.mp3',duration:180,license:'CC0',licenseUrl:'https://…',source:'https://…'} */
const CATALOG_SRC=[];
const CATALOG=CATALOG_SRC.map(r=>({id:'c-'+r.file,name:r.title,artist:r.artist,srcs:[r.file],dur:r.duration||0,bundled:true,license:r.license,licenseUrl:r.licenseUrl,source:r.source}));
const BY_ID=new Map(CATALOG.map(t=>[t.id,t]));

let favs=st.g('favs',[]), hist=st.g('hist',[]), pls=st.g('pls',[]);
let links=st.g('links',[]), accts=st.g('accts',[]), sess=st.g('sess',null);
if(!Array.isArray(links))links=[];if(!Array.isArray(accts))accts=[];
let prof=st.g('prof',null);
if(!prof){prof={name:'Слушатель',since:Date.now(),plays:0};st.s('prof',prof)}
if(!Array.isArray(prof.promos))prof.promos=[];
/* каталог Jamendo убран: оставляем свои файлы и встроенный каталог (его треки берём из актуального CATALOG) */
const onlyMine=a=>Array.isArray(a)?a.map(t=>t&&((t.local||t.link||t.online)?t:BY_ID.get(t.id))).filter(Boolean):[];
favs=onlyMine(favs);hist=onlyMine(hist);pls=(Array.isArray(pls)?pls:[]).map(p=>({...p,tracks:onlyMine(p.tracks)}));
st.s('favs',favs);st.s('hist',hist);st.s('pls',pls);
try{localStorage.removeItem('cid')}catch(e){}
let vol=st.g('vol',1), rep=st.g('rep','off');
let tab='my', sub=null;
let queue=[], idx=-1, shuf=false, errs=0, srcK=0, dragging=false, toastT;
let sq='';
const au=new Audio();
au.preload='auto';au.volume=vol;au.loop=rep==='one';

/* ---------- свои файлы (хранятся в браузере, IndexedDB) ---------- */
const AUD=/\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|webm)$/i;
let mine=[], objURL='';
const DB={
  open(){return this._p||(this._p=new Promise((res,rej)=>{
    const r=indexedDB.open('volna',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }))},
  async tx(mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));
      t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
    });
  },
  put(rec){return this.tx('readwrite',s=>s.put(rec))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  all(){return this.tx('readonly',s=>s.getAll())},
  clear(){return this.tx('readwrite',s=>s.clear())}
};
async function loadMine(){
  try{const a=await DB.all();mine=(a||[]).map(({blob,...m})=>m).sort((x,y)=>y.added-x.added)}catch(e){mine=[]}
  refresh();
}
function parseName(fn){
  const b=fn.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const m=b.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  return m?{artist:m[1].trim(),name:m[2].trim()}:{artist:'Неизвестный исполнитель',name:b};
}
function durOf(file){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),a=new Audio();let done=false;
    const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);res(isFinite(d)?Math.round(d):0)};
    a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);
    setTimeout(()=>fin(0),4000);a.src=u;
  });
}
async function addFiles(files){
  const arr=[...files].filter(f=>(f.type||'').startsWith('audio/')||AUD.test(f.name));
  if(!arr.length){toast('Выберите аудиофайлы (mp3, m4a, flac, ogg, wav)');return}
  let n=0;
  for(const f of arr){
    try{
      const p=parseName(f.name);
      const rec={id:'l'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:p.name,artist:p.artist,dur:await durOf(f),local:true,added:Date.now(),blob:f};
      await DB.put(rec);
      const {blob,...m}=rec;mine.unshift(m);n++;
    }catch(e){toast('Не удалось сохранить файл: '+f.name)}
  }
  if(n){toast('Добавлено: '+n);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  refresh();
}
function pickFiles(){
  const i=el('input');i.type='file';i.multiple=true;i.accept='audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav';
  i.onchange=()=>addFiles(i.files);i.click();
}
function pickFolder(){
  const i=el('input');i.type='file';i.webkitdirectory=true;i.onchange=()=>addFiles(i.files);i.click();
}
const openUrl=u=>window.open(u,'_blank','noopener');
function addMusic(){
  openSheet('Добавить музыку',[
    {label:'Файлы с устройства (mp3, m4a, flac…)',fn:pickFiles},
    {label:'Папка с музыкой',fn:pickFolder},
    {label:'По ссылке (прямая ссылка на аудио)',fn:addLink},
    {label:'Из Telegram',fn:()=>openSheet('Музыка из Telegram',[
      {label:'Выбрать сохранённые файлы',fn:pickFiles},
      {label:'Открыть Telegram Web',fn:()=>openUrl('https://web.telegram.org/')}
    ],'Telegram не отдаёт треки напрямую. Сначала сохраните аудио из чата на устройство: на Android нажмите «⋮» → «Сохранить в музыку» (или в загрузки), на iPhone «Поделиться» → «Сохранить в Файлы», на компьютере правый клик → «Сохранить как». Затем нажмите «Выбрать сохранённые файлы» и найдите их в папке Telegram или «Загрузки».')},
  ]);
}
async function removeLocal(t){
  try{if(t.local)await DB.del(t.id)}catch(e){}links=links.filter(x=>x.id!==t.id);
  mine=mine.filter(x=>x.id!==t.id);favs=favs.filter(x=>x.id!==t.id);hist=hist.filter(x=>x.id!==t.id);
  pls.forEach(p=>{p.tracks=p.tracks.filter(x=>x.id!==t.id)});save();
  if(cur()&&cur().id===t.id){au.pause();au.removeAttribute('src')}
  toast('Файл удалён');
  refresh();
}


/* ---------- свои ссылки на музыку ---------- */
const myAll=()=>[...links,...mine].sort((x,y)=>(y.added||0)-(x.added||0));
const PAGES=/(^|\.)(youtube\.com|youtu\.be|spotify\.com|soundcloud\.com|music\.yandex\.\w+|vk\.com|vk\.ru|deezer\.com|music\.apple\.com|tiktok\.com|t\.me|instagram\.com|zvuk\.com|boom\.ru)$/i;
function normUrl(u){
  u=(u||'').trim();
  if(!/^https?:\/\//i.test(u)){if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u))u='https://'+u;else return ''}
  try{
    const x=new URL(u);
    if(/(^|\.)dropbox\.com$/.test(x.hostname)){x.searchParams.delete('dl');x.searchParams.set('raw','1')}
    if(x.hostname==='drive.google.com'){
      const id=(x.pathname.match(/\/file\/d\/([^/]+)/)||[])[1]||x.searchParams.get('id');
      if(id)return 'https://drive.google.com/uc?export=download&id='+id;
    }
    if(x.protocol==='http:'&&location.protocol==='https:')x.protocol='https:';
    return x.href;
  }catch(e){return ''}
}
function probeUrl(u){
  return new Promise(res=>{
    const a=new Audio();let done=false;
    const fin=r=>{if(done)return;done=true;a.removeAttribute('src');res(r)};
    a.preload='metadata';
    a.onloadedmetadata=()=>fin({ok:true,dur:isFinite(a.duration)?Math.round(a.duration):0});
    a.onerror=()=>fin({ok:false});
    setTimeout(()=>fin({ok:false}),8000);
    a.src=u;
  });
}
function addLink(){
  const raw=prompt('Вставьте ссылку на аудио (mp3, m4a, ogg, wav или потоковую ссылку)','https://');
  if(!raw||raw.trim()==='https://')return;
  const u=normUrl(raw);
  if(!u){toast('Это не похоже на ссылку');return}
  const host=new URL(u).hostname.replace(/^www\./,'');
  if(PAGES.test(host)){

async function hashPw(pw,salt){
  const d=salt+':'+pw;
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381;for(let i=0;i<d.length;i++)h=((h<<5)+h+d.charCodeAt(i))>>>0;
  return 'f'+h.toString(16);
}

const EXT={'audio/mpeg':'mp3','audio/mp3':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/aac':'aac','audio/flac':'flac','audio/x-flac':'flac','audio/ogg':'ogg','audio/wav':'wav','audio/x-wav':'wav','audio/webm':'webm'};
const trackLabel=t=>[t.artist&&t.artist!=='Неизвестный исполнитель'?t.artist:'',t.name].filter(Boolean).join(' — ');
function trackFile(t,blob){
  const m=(blob.name||'').match(/\.[a-z0-9]{2,5}$/i);
  const ext=m?m[0]:'.'+(EXT[blob.type]||'mp3');
  const nm=trackLabel(t).replace(/ — /g,' - ').replace(/[\\/:*?"<>|]+/g,'_')||'track';
  return new File([blob],nm+ext,{type:blob.type||'audio/mpeg'});
}
function saveFile(f){
  const u=URL.createObjectURL(f),a=el('a');a.href=u;a.download=f.name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
/* fileP — заранее готовый файл (читаем из базы, пока открыто меню), чтобы share сработал сразу после нажатия */
async function shareTrack(t,fileP){
  try{
    if(t.local){
      const f=await fileP;
      if(!f){toast('Файл не найден. Добавьте его заново.');return}
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:t.name,text:trackLabel(t)});return;
      }
      saveFile(f);toast('Здесь нельзя отправить файл напрямую, он сохранён на устройство');return;
    }
    const url=t.source||(t.srcs&&t.srcs[0]);
    if(!url){toast('Нет ссылки на этот трек');return}
    if(navigator.share){await navigator.share({title:t.name,text:trackLabel(t),url});return}
    try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}
    catch(e){prompt('Скопируйте ссылку',url)}
  }catch(e){
    if(e&&e.name==='AbortError')return;
    toast('Не удалось поделиться');
  }
}
function trackMenu(t,o){

  if(o&&o.pl)items.push({label:'Убрать из этого плейлиста',dg:true,fn:()=>{o.pl.tracks=o.pl.tracks.filter(x=>x.id!==t.id);save();renderMore()}});

/* ---------- промокоды ----------
   Коды лежат прямо в этом файле, поэтому они не секретные: любой, кто откроет код, их увидит.
   Для настоящих (платных/одноразовых) кодов нужен сервер. Здесь же награда — бонусы в самом плеере.
   Чтобы добавить код: 'КОД':{title:'Название',desc:'Описание',badge:'Значок в профиле'} или accent:'#цвет',on:'#цвет текста на нём' */
const PROMOS={
  'JAMBO':{title:'Добро пожаловать',desc:'Значок «Первый слушатель» в профиле',badge:'Первый слушатель'},
  'GREEN':{title:'Зелёная тема',desc:'Зелёный акцентный цвет',accent:'#3ddc84',on:'#04210f'},
  'VIOLET':{title:'Фиолетовая тема',desc:'Фиолетовый акцентный цвет',accent:'#a78bfa',on:'#150b33'}
};
const hasPromo=c=>Object.prototype.hasOwnProperty.call(PROMOS,c);
function applyTheme(){
  const r=document.documentElement.style,pr=prof.theme&&hasPromo(prof.theme)&&prof.promos.includes(prof.theme)?PROMOS[prof.theme]:null;
  if(pr&&pr.accent){r.setProperty('--ac',pr.accent);r.setProperty('--on',pr.on||'#000')}
  else{r.removeProperty('--ac');r.removeProperty('--on')}
}
const badgeText=()=>{const b=prof.promos.filter(hasPromo).map(c=>PROMOS[c]).filter(p=>p.badge).pop();return b?b.badge:''};
function activatePromo(raw){
  const code=(raw||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!code){toast('Введите промокод');return false}
  if(!hasPromo(code)){toast('Такого промокода нет');return false}
  if(prof.promos.includes(code)){toast('Этот промокод уже активирован');return false}
  prof.promos.push(code);
  if(PROMOS[code].accent)prof.theme=code;
  applyTheme();save();toast('Промокод активирован: '+PROMOS[code].title);return true;
}

const jmT=r=>({id:'jm:'+r.id,name:r.name,artist:r.artist_name||'Исполнитель',img:https(r.image||r.album_image||''),dur:+r.duration||0,srcs:[https(r.audio)],source:r.shareurl||'https://www.jamendo.com',online:true});
const itT=r=>({id:'it:'+r.trackId,name:r.trackName,artist:r.artistName,img:bigImg(r.artworkUrl100),dur:30,srcs:[https(r.previewUrl)],source:r.trackViewUrl,online:true,preview:true});
async function getJson(u){const r=await fetch(u);if(!r.ok)throw new Error('ошибка '+r.status);return r.json()}
/* запрос к Jamendo: ответ приходит в виде {headers:{status,error_message},results:[...]} */
async function jmJson(params){
  let d;
  try{d=await getJson(JM+'/tracks/?client_id='+JM_ID+'&format=json&imagesize=300&audioformat=mp32&'+params)}
  catch(e){throw new Error(e&&e.message==='Failed to fetch'?'нет соединения с Jamendo':(e&&e.message)||'нет ответа')}
  if(!d||!d.headers||d.headers.status!=='success')throw new Error((d&&d.headers&&d.headers.error_message)||'ошибка Jamendo');
  return (d.results||[]).filter(x=>x.audio).map(jmT);
}

/* ---------- плейлист по ссылке: в ссылке только имя и id треков, остальное подгружается при открытии ---------- */
async function sharePlLink(p){
  const ids=p.tracks.filter(t=>t.online).map(t=>t.id);
  const url=location.href.split('#')[0]+'#pl='+encodeURIComponent(p.name)+'/'+ids.join(',');
  if(!/^https?:$/.test(location.protocol))toast('Ссылка заработает у друзей, когда плеер будет размещён в интернете');
  try{
    if(navigator.share){await navigator.share({title:p.name,text:'Плейлист «'+p.name+'»',url});return}
    try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}catch(e){prompt('Скопируйте ссылку',url)}
  }catch(e){if(!(e&&e.name==='AbortError'))toast('Не удалось поделиться')}
}
function readShared(){
  const m=location.hash.match(/^#pl=(.*)$/);if(!m)return;
  const i=m[1].lastIndexOf('/');if(i<0)return;
  let name='';try{name=decodeURIComponent(m[1].slice(0,i))}catch(e){}
  const ids=m[1].slice(i+1).split(',').filter(x=>/^(jm:\d+|it:\d+)$/.test(x)).slice(0,100);
  if(!ids.length)return;
  shared={name:name.slice(0,60)||'Плейлист',ids,tracks:null};sub={t:'shared'};tab='more';
}
async function loadShared(){
  const s=shared;if(!s||s.tracks||s.loading)return;s.loading=true;
  const jm=s.ids.filter(x=>x[0]==='j').map(x=>x.slice(3)),it=s.ids.filter(x=>x[0]==='i').map(x=>x.slice(3)),m=new Map();
  try{if(jm.length)(await jmJson('limit=100&id='+jm.join('+'))).forEach(t=>m.set(t.id,t))}catch(e){}
  try{if(it.length)(await getJson('https://itunes.apple.com/lookup?id='+it.join(','))).results.filter(x=>x.previewUrl).forEach(x=>{const t=itT(x);m.set(t.id,t)})}catch(e){}
  s.tracks=s.ids.map(i=>m.get(i)).filter(Boolean);
  if(shared===s&&tab==='more'&&sub&&sub.t==='shared')renderMore();
}

/* выбор треков из «Моих файлов» прямо внутри плейлиста (меню открывается снова после каждого добавления) */
function pickTracks(p){
  const free=myAll().filter(t=>!p.tracks.some(x=>x.id===t.id));
  if(!free.length){toast(myAll().length?'Все ваши треки уже в этом плейлисте':'Сначала добавьте свои треки в «Ещё» → «Добавить музыку»');return}
  openSheet('Добавить в «'+p.name+'»',free.slice(0,60).map(t=>({label:trackLabel(t),fn:()=>{p.tracks.push(t);save();renderMore();toast('Добавлено');pickTracks(p)}})),
    free.length>60?'Показаны первые 60 треков. Остальные добавляйте через меню «⋮» у трека.':'Нажмите на трек, чтобы добавить. Закройте окно, когда закончите.');
}
function sharePlaylist(p){
  if(!p.tracks.length){toast('Плейлист пуст');return}
  const loc=p.tracks.filter(t=>t.local);
  /* файлы читаем заранее, пока открыто меню, чтобы отправка сработала сразу после нажатия */
  const filesP=Promise.all(loc.map(t=>DB.get(t.id).then(r=>r&&r.blob?trackFile(t,r.blob):null).catch(()=>null))).then(a=>a.filter(Boolean));
  const items=[];
  if(p.tracks.some(t=>t.online))items.push({label:'Ссылкой на плейлист',fn:()=>sharePlLink(p)});
  items.push({label:'Списком треков (текст)',fn:()=>sharePlText(p)});
  if(loc.length)items.push({label:'Файлами · '+plr(loc.length,['файл','файла','файлов']),fn:()=>sharePlFiles(p,filesP)});
  openSheet('Поделиться «'+p.name+'»',items,'Ссылка открывает плейлист у друга, в неё входят только треки из раздела «Онлайн». Файлы можно отправить в Telegram, WhatsApp и другие приложения, если ваше устройство это поддерживает.');
}
async function sharePlText(p){
  const text=p.name+'\n'+p.tracks.map((t,i)=>(i+1)+'. '+trackLabel(t)).join('\n')+'\n\nПлейлист из Jambo Music';
  try{
    if(navigator.share){await navigator.share({title:p.name,text});return}
    try{await navigator.clipboard.writeText(text);toast('Список скопирован')}catch(e){prompt('Скопируйте список',text)}
  }catch(e){if(!(e&&e.name==='AbortError'))toast('Не удалось поделиться')}
}
async function sharePlFiles(p,filesP){
  try{
    const files=await filesP;
    if(!files.length){toast('Файлы не найдены. Добавьте их заново.');return}
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:p.name,text:p.name});return}
    files.forEach(saveFile);toast('Здесь нельзя отправить файлы напрямую, они сохранены на устройство');
  }catch(e){if(!(e&&e.name==='AbortError'))toast('Не удалось поделиться')}
}

function exportData(){
  const blob=new Blob([JSON.stringify({v:1,favs,hist,pls,links,prof})],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='jambo-music-backup.json';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
  const i=el('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{
    try{
      const d=JSON.parse(await i.files[0].text());
      if(Array.isArray(d.links))links=d.links.filter(x=>x&&x.link&&Array.isArray(x.srcs));
      if(Array.isArray(d.favs))favs=onlyMine(d.favs);if(Array.isArray(d.hist))hist=onlyMine(d.hist);if(Array.isArray(d.pls))pls=d.pls.map(p=>({...p,tracks:onlyMine(p.tracks)}));
      if(d.prof&&typeof d.prof==='object')prof={...prof,...d.prof};
      save();toast('Данные загружены');renderMore();
    }catch(e){toast('Не удалось прочитать файл')}
  };
  i.click();
}

/* ---------- плеер ---------- */
function play(arr,i){queue=arr.slice();idx=i;errs=0;start()}
function playAu(){
  const p=au.play();
  if(p&&p.catch)p.catch(e=>{
    if(e.name==='NotAllowedError')toast('Браузер заблокировал звук. Нажмите Play ещё раз.');
    else if(e.name!=='AbortError'&&e.name!=='NotSupportedError')toast('Ошибка звука: '+e.name);
  });
}
function setSrc(t,k){
  srcK=k;
  if(t.local){
    au.pause();
    DB.get(t.id).then(rec=>{
      if(cur()!==t)return;
      if(!rec||!rec.blob){toast('Файл не найден. Добавьте его заново.');return}
      if(objURL)URL.revokeObjectURL(objURL);
      objURL=URL.createObjectURL(rec.blob);au.src=objURL;playAu();
    }).catch(()=>toast('Не удалось открыть файл'));
    return;
  }
  const list=t.srcs&&t.srcs.length?t.srcs:[t.src];
  au.src=list[k];
  playAu();
}
function start(){
  const t=cur();if(!t)return;
  setSrc(t,0);
  $('#mini').classList.add('show');document.body.classList.add('has-player');
  [$('#mcv'),$('#fcv')].forEach(i=>{i.src=t.img||PH});
  $('#mnm').textContent=$('#fnm').textContent=t.name;
  $('#mar').textContent=$('#far').textContent=t.artist;
  hist=[t,...hist.filter(x=>x.id!==t.id)].slice(0,50);
  prof.plays=(prof.plays||0)+1;save();
  $$('.row').forEach(r=>r.classList.toggle('on',r.dataset.id===t.id));
  showLic(t);
  tick();sync();
  if('mediaSession' in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist,artwork:t.img?[{src:t.img,sizes:'300x300'}]:[]})}catch(e){}
  }
}
function showLic(t){
  const b=$('#flic');b.textContent='';
  if(!t.bundled||!t.license)return;
  const a=(txt,u)=>{if(!/^https:\/\//.test(u||''))return txt;const x=el('a',null,txt);x.href=u;x.target='_blank';x.rel='noopener';return x};
  b.append('Лицензия: ',a(t.license,t.licenseUrl));
  if(t.source)b.append(' · ',a('источник',t.source));
}
function sync(){
  const p=!au.paused;
  $$('.js-pp').forEach(b=>{b.innerHTML=p?IC.pause:IC.play;b.setAttribute('aria-label',p?'Пауза':'Играть')});
  $$('.js-shuf').forEach(b=>{b.innerHTML=IC.shuf;b.setAttribute('aria-pressed',shuf)});
  $$('.js-rep').forEach(b=>{b.innerHTML=rep==='one'?IC.rep1:IC.rep;b.setAttribute('aria-pressed',rep!=='off');b.setAttribute('aria-label',rep==='off'?'Повтор выключен':rep==='all'?'Повторять всё':'Повторять трек')});
  const m=au.muted||au.volume===0;
  $$('.js-mute').forEach(b=>{b.innerHTML=m?IC.mute:IC.vol;b.setAttribute('aria-label',m?'Включить звук':'Выключить звук')});
  $$('.js-vol').forEach(i=>{i.value=m?0:vol;setP(i)});
  const t=cur();if(!t)return;
  const f=$('#ffav');
  f.dataset.id=t.id;f.className='ib fav'+(isFav(t)?' on':'');
  f.innerHTML=IC.heart;
  f.setAttribute('aria-label',isFav(t)?'Убрать из избранного':'В избранное');
}
function setP(i){const mx=+i.max||1;i.style.setProperty('--p',(Math.min(1,i.value/mx)*100)+'%')}
function tick(){
  const d=au.duration||(cur()&&cur().dur)||0,c=au.currentTime||0;
  $('#bar').style.width=d?(c/d*100)+'%':'0';
  $$('.js-seek').forEach(s=>{if(dragging&&document.activeElement===s)return;s.max=d;s.value=c;setP(s)});
  $$('.js-t1').forEach(e=>e.textContent=fmt(c));
  $$('.js-t2').forEach(e=>e.textContent=fmt(d));
}
function step(d){
  if(!queue.length)return;
  if(shuf&&queue.length>1){let n;do n=Math.floor(Math.random()*queue.length);while(n===idx);idx=n}
  else idx=(idx+d+queue.length)%queue.length;
  errs=0;start();
}
function toggle(){if(!cur())return;au.paused?playAu():au.pause()}
function cycleRep(){rep=rep==='off'?'all':rep==='all'?'one':'off';au.loop=rep==='one';st.s('rep',rep);sync()}
function setVol(v){vol=Math.max(0,Math.min(1,v));au.volume=vol;au.muted=false;st.s('vol',vol);sync()}

au.onplay=au.onpause=sync;
au.onplaying=()=>{errs=0};
au.ontimeupdate=au.onloadedmetadata=au.ondurationchange=tick;
au.onvolumechange=sync;
au.onended=()=>{
  if(rep==='off'&&!shuf&&idx===queue.length-1){sync();return}
  step(1);
};
au.onerror=()=>{
  const t=cur();if(!t)return;
  const list=t.srcs&&t.srcs.length?t.srcs:[t.src];
  if(srcK<list.length-1){setSrc(t,srcK+1);return}
  if(++errs>3){toast('Не удаётся воспроизвести (код '+(au.error?au.error.code:'?')+'). '+(t.bundled?'Проверьте подключение к интернету.':'Файл повреждён или не поддерживается.'));return}
  toast('Трек не воспроизводится, переключаю');step(1);
};

/* кнопки плеера */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('js-pp'))toggle();
  else if(b.classList.contains('js-next'))step(1);
  else if(b.classList.contains('js-prev')){if(au.currentTime>3)au.currentTime=0;else step(-1)}
  else if(b.classList.contains('js-shuf')){shuf=!shuf;sync()}
  else if(b.classList.contains('js-rep'))cycleRep();
  else if(b.classList.contains('js-mute')){au.muted=!au.muted;if(!au.muted&&vol===0)setVol(.5);sync()}
});
$$('.js-seek').forEach(s=>{
  s.addEventListener('pointerdown',()=>{dragging=true});
  s.addEventListener('pointerup',()=>{dragging=false});
  s.addEventListener('input',()=>{au.currentTime=+s.value;setP(s)});
});
$$('.js-vol').forEach(i=>i.addEventListener('input',()=>setVol(+i.value)));
$('#ffav').onclick=()=>{if(cur())toggleFav(cur())};
$('#fmore').onclick=()=>{if(cur())trackMenu(cur())};
$('#open').onclick=$('#expand').onclick=()=>$('#full').classList.add('open');
$('#close').onclick=()=>$('#full').classList.remove('open');

if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  const h=(n,f)=>{try{m.setActionHandler(n,f)}catch(e){}};
  h('play',()=>playAu());h('pause',()=>au.pause());
  h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
  h('seekto',d=>{if(d.seekTime!=null)au.currentTime=d.seekTime});
}

/* клавиатура (компьютер) */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();$('#full').classList.remove('open');return}
  const tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='BUTTON'&&e.key===' '))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===' '){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.shiftKey?step(1):au.currentTime=Math.min(au.duration||1e9,au.currentTime+5)}
  else if(e.key==='ArrowLeft'){e.shiftKey?step(-1):au.currentTime=Math.max(0,au.currentTime-5)}
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(vol+.05)}
  else if(e.key==='ArrowDown'){e.preventDefault();setVol(vol-.05)}
});

/* ---------- вкладки ---------- */
const TABS={my:['Моя музыка',IC.note],search:['Поиск',IC.search],more:['Ещё',IC.more]};
$$('.navb').forEach(b=>{
  const t=TABS[b.dataset.t];
  b.innerHTML=t[1]+'<span>'+t[0]+'</span>';
  b.onclick=()=>{if(b.dataset.t==='more')sub=null;setTab(b.dataset.t)};
});
function setTab(t){
  tab=t;
  $$('.navb').forEach(b=>{if(b.dataset.t===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  ['my','search','more'].forEach(k=>$('#v-'+k).hidden=k!==t);
  if(t==='my')renderMy();
  else if(t==='more')renderMore();
  else renderSearch();
  window.scrollTo(0,0);
}
$('#sico').innerHTML=IC.search;
$('#q').oninput=e=>{sq=e.target.value.trim();renderSearch()};
$('#close').innerHTML=IC.down;
$('#expand').innerHTML=IC.up;
$('#fmore').innerHTML=IC.dots;
$$('.js-prev').forEach(b=>b.innerHTML=IC.prev);
$$('.js-next').forEach(b=>b.innerHTML=IC.next);
sync();
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{
  e.preventDefault();
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){if(tab!=='my')setTab('my');addFiles(e.dataTransfer.files)}
});
readShared();
setTab(shared?'more':'my');
loadMine();
addEventListener('hashchange',()=>{readShared();if(shared)setTab('more')});
</script>
</body>
