<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Волна — бесплатная музыка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#161827;--s1:#1f2236;--s2:#2a2e48;--tx:#eceaf6;--mu:#9a9bb8;--ac:#7cc4ff;--hot:#ff7d95;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:24px;height:24px;fill:currentColor}
.search{margin:8px 0 4px}
.search input,#cid{width:100%;height:46px;border-radius:14px;border:0;background:var(--s1);color:var(--tx);padding:0 14px;font:inherit}
.search input::placeholder,#cid::placeholder{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--s1);color:var(--mu)}
.chip[aria-pressed=true]{background:var(--ac);color:#0d1424;font-weight:500}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--s2)}
.tab{padding:10px 0;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--tx);border-color:var(--ac);font-weight:500}
.row{display:flex;align-items:center;padding:0 4px 0 16px}
.pl{flex:1;min-width:0;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px 0;text-align:left}
.cv{width:52px;height:52px;border-radius:8px;background:var(--s2);object-fit:cover;display:block}
.mt{min-width:0}
.nm,.ar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-weight:500}
.ar{color:var(--mu);font-size:14px}
.du{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.row.on .nm{color:var(--ac)}
.fav svg{fill:none;stroke:currentColor;stroke-width:2;color:var(--mu)}
.fav.on svg{fill:var(--hot);stroke:var(--hot)}
.note{color:var(--mu);padding:16px;margin:0}
.foot{font-size:13px;padding-top:24px}
#setup{padding:20px 16px}
#setup h2{margin:0 0 8px;font-size:20px}
#setup p{color:var(--mu);margin:0 0 14px}
.btn{height:46px;padding:0 20px;border-radius:14px;background:var(--ac);color:#0d1424;font-weight:500;margin:12px 8px 0 0}
.btn.alt{background:var(--s1);color:var(--tx)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--s2);border-radius:16px;display:none;align-items:center;overflow:hidden;z-index:6}
#mini.show{display:flex}
#open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;text-align:left}
#mini .cv{width:44px;height:44px}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ac)}
#full{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
#full.open{transform:none;visibility:visible;transition:transform .3s ease}
.stage{flex:1;display:grid;place-items:center;min-height:0}
#fcv{width:min(78vw,340px);max-height:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;background:var(--s2)}
.info{display:flex;align-items:center;gap:8px;margin-top:16px}
.info>div{flex:1;min-width:0}
#fnm{font-size:22px;font-weight:700;letter-spacing:-.01em}
#far{color:var(--mu)}
#seek{width:100%;margin:16px 0 0;accent-color:var(--ac)}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.big{width:68px;height:68px;border-radius:50%;background:var(--ac);color:#0d1424;display:grid;place-items:center}
.big svg{width:32px;height:32px;fill:currentColor}
#shuf svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#shuf[aria-pressed=true]{color:var(--ac)}
#shuf[aria-pressed=false]{color:var(--mu)}
.lic{text-align:center;font-size:13px;margin-top:12px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--s2);padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){#full,#full.open{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Волна</h1>
    <button class="ib" id="gear" aria-label="Настройки" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
  <div id="tools">
    <div class="search"><input id="q" type="search" placeholder="Трек, исполнитель, жанр" aria-label="Поиск"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-home" aria-selected="true" type="button">Обзор</button>
    <button class="tab" role="tab" id="t-fav" aria-selected="false" type="button">Избранное</button>
  </div>
</header>

<main>
  <section id="setup" hidden>
    <h2>Подключите Jamendo</h2>
    <p>Для каталога нужен бесплатный client_id. Зарегистрируйтесь на <a href="https://devportal.jamendo.com" target="_blank" rel="noopener">devportal.jamendo.com</a>, создайте приложение и скопируйте его client_id.</p>
    <input id="cid" placeholder="client_id" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="client_id">
    <button class="btn" id="save" type="button">Сохранить</button><button class="btn alt" id="cancel" type="button" hidden>Закрыть</button>
  </section>
  <div id="list"></div>
</main>

<div id="mini">
  <button id="open" type="button" aria-label="Открыть плеер">
    <img class="cv" id="mcv" alt="">
    <div class="mt"><div class="nm" id="mnm"></div><div class="ar" id="mar"></div></div>
  </button>
  <button class="ib" id="mpp" type="button" aria-label="Играть"></button>
  <div id="bar"></div>
</div>

<section id="full" aria-label="Плеер">
  <button class="ib" id="close" type="button" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="stage"><img id="fcv" alt=""></div>
  <div class="info">
    <div><div class="nm" id="fnm"></div><div class="ar" id="far"></div></div>
    <button class="ib fav" id="ffav" type="button"></button>
  </div>
  <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Перемотка">
  <div class="times"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctl">
    <button class="ib" id="shuf" type="button" aria-label="Вперемешку" aria-pressed="false"></button>
    <button class="ib" id="prev" type="button" aria-label="Предыдущий"></button>
    <button class="big" id="fpp" type="button" aria-label="Играть"></button>
    <button class="ib" id="next" type="button" aria-label="Следующий"></button>
    <span class="ib"></span>
  </div>
  <div class="lic"><a id="lic" href="https://www.jamendo.com" target="_blank" rel="noopener">Лицензия трека</a></div>
</section>

<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const st={
  g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const I={
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.5l-1.4-1.3C5.4 14.5 2 11.4 2 7.6 2 4.5 4.4 2.5 7 2.5c1.7 0 3.4.8 5 2.6 1.6-1.8 3.3-2.6 5-2.6 2.6 0 5 2 5 5.1 0 3.8-3.4 6.9-8.6 11.6z"/></svg>',
  shuf:'<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
};
const TAGS=[['','Все'],['pop','Поп'],['rock','Рок'],['electronic','Электроника'],['hiphop','Хип-хоп'],['jazz','Джаз'],['classical','Классика'],['ambient','Эмбиент'],['lounge','Лаунж']];

let cid=st.g('cid',''), favs=st.g('favs',[]), list=[], view='home', tag='', q='';
let queue=[], idx=-1, shuf=false, req=0, errs=0, timer;
const au=new Audio();

const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const cur=()=>queue[idx];
const isFav=t=>favs.some(f=>f.id===t.id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2600)}

/* ---- Jamendo ---- */
async function api(params){
  const u=new URL('https://api.jamendo.com/v3.0/tracks/');
  const p={client_id:cid,format:'json',limit:30,audioformat:'mp32',imagesize:300,...params};
  for(const k in p)if(p[k]!=='')u.searchParams.set(k,p[k]);
  const r=await fetch(u.toString());
  const d=await r.json();
  if(!d.headers||d.headers.status!=='success')throw new Error((d.headers&&d.headers.error_message)||'ошибка ответа');
  return d.results.filter(t=>t.audio).map(t=>({
    id:String(t.id),name:t.name,artist:t.artist_name,dur:+t.duration,
    img:t.image,src:t.audio,lic:t.license_ccurl,url:t.shareurl
  }));
}
async function load(){
  if(!cid){showSetup(true);return}
  const box=$('#list'),n=++req;
  box.textContent='';box.append(el('p','note','Загружаю…'));
  try{
    const p=q?{search:q}:{order:'popularity_week'};
    if(tag)p.tags=tag;
    const r=await api(p);
    if(n!==req)return;
    list=r;
  }catch(e){
    if(n!==req)return;
    list=[];box.textContent='';
    box.append(el('p','note','Не получилось загрузить: '+e.message+'. Проверьте client_id и подключение к интернету.'));
    return;
  }
  render();
}

/* ---- список ---- */
function favBtn(t,cls){
  const b=el('button','ib fav'+(cls||'')+(isFav(t)?' on':''));
  b.type='button';b.innerHTML=I.heart;
  b.setAttribute('aria-label',isFav(t)?'Убрать из избранного':'В избранное');
  b.onclick=e=>{e.stopPropagation();toggleFav(t)};
  return b;
}
function toggleFav(t){
  favs=isFav(t)?favs.filter(f=>f.id!==t.id):[t,...favs];
  st.s('favs',favs);
  render();sync();
}
function render(){
  $('#t-fav').textContent='Избранное'+(favs.length?' · '+favs.length:'');
  if(!$('#setup').hidden)return;
  const arr=view==='fav'?favs:list,box=$('#list');
  box.textContent='';
  if(!arr.length){
    box.append(el('p','note',view==='fav'?'Здесь появятся треки, у которых вы нажали на сердечко.':'Ничего не найдено. Попробуйте другой запрос.'));
    return;
  }
  arr.forEach((t,i)=>{
    const r=el('div','row'+(cur()&&cur().id===t.id?' on':''));
    const b=el('button','pl');b.type='button';
    b.setAttribute('aria-label','Играть: '+t.name+', '+t.artist);
    const im=el('img','cv');im.loading='lazy';im.alt='';im.src=t.img;im.onerror=()=>im.removeAttribute('src');
    const m=el('div','mt');m.append(el('div','nm',t.name),el('div','ar',t.artist));
    b.append(im,m,el('span','du',fmt(t.dur)));
    b.onclick=()=>play(arr,i);
    r.append(b,favBtn(t));
    box.append(r);
  });
  box.append(el('p','note foot','Музыка с Jamendo. Треки выходят под лицензиями Creative Commons: ссылка на лицензию есть в полном плеере.'));
}

/* ---- плеер ---- */
function play(arr,i){queue=arr.slice();idx=i;errs=0;start()}
function start(){
  const t=cur();if(!t)return;
  au.src=t.src;au.play().catch(()=>{});
  $('#mini').classList.add('show');
  $('#mcv').src=$('#fcv').src=t.img;
  $('#mnm').textContent=$('#fnm').textContent=t.name;
  $('#mar').textContent=$('#far').textContent=t.artist;
  $('#lic').href=t.lic||t.url||'https://www.jamendo.com';
  $('#seek').value=0;
  sync();render();
  if('mediaSession' in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist,artwork:[{src:t.img,sizes:'300x300'}]})}catch(e){}
  }
}
function sync(){
  const p=!au.paused;
  $('#mpp').innerHTML=$('#fpp').innerHTML=p?I.pause:I.play;
  $('#mpp').setAttribute('aria-label',p?'Пауза':'Играть');
  $('#fpp').setAttribute('aria-label',p?'Пауза':'Играть');
  const t=cur();if(!t)return;
  const f=$('#ffav');
  f.className='ib fav'+(isFav(t)?' on':'');
  f.innerHTML=I.heart;
  f.setAttribute('aria-label',isFav(t)?'Убрать из избранного':'В избранное');
}
function step(d){
  if(!queue.length)return;
  if(shuf&&queue.length>1){let n;do n=Math.floor(Math.random()*queue.length);while(n===idx);idx=n}
  else idx=(idx+d+queue.length)%queue.length;
  start();
}
function toggle(){au.paused?au.play().catch(()=>{}):au.pause()}

au.onplay=au.onpause=sync;
au.onplaying=()=>{errs=0};
au.ontimeupdate=()=>{
  const d=au.duration||(cur()&&cur().dur)||0,c=au.currentTime;
  $('#bar').style.width=d?(c/d*100)+'%':'0';
  $('#seek').max=d;$('#seek').value=c;
  $('#t1').textContent=fmt(c);$('#t2').textContent=fmt(d);
};
au.onended=()=>step(1);
au.onerror=()=>{
  if(++errs>3){toast('Не удаётся воспроизвести треки. Проверьте подключение.');return}
  toast('Трек не воспроизводится, переключаю');step(1);
};

$('#mpp').onclick=$('#fpp').onclick=toggle;
$('#next').onclick=()=>step(1);
$('#prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
$('#seek').oninput=e=>{au.currentTime=+e.target.value};
$('#ffav').onclick=()=>{if(cur())toggleFav(cur())};
$('#shuf').innerHTML=I.shuf;
$('#shuf').onclick=e=>{shuf=!shuf;e.currentTarget.setAttribute('aria-pressed',shuf)};
$('#prev').innerHTML=I.prev;$('#next').innerHTML=I.next;
$('#open').onclick=()=>$('#full').classList.add('open');
$('#close').onclick=()=>$('#full').classList.remove('open');

if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>au.play());
  m.setActionHandler('pause',()=>au.pause());
  m.setActionHandler('previoustrack',()=>step(-1));
  m.setActionHandler('nexttrack',()=>step(1));
}

/* ---- навигация ---- */
function showSetup(on){
  $('#setup').hidden=!on;
  $('#list').hidden=on;
  $('#tools').hidden=on||view==='fav';
  $('#cancel').hidden=!cid;
  if(on)$('#cid').value=cid;
}
function go(v){
  view=v;
  $('#t-home').setAttribute('aria-selected',v==='home');
  $('#t-fav').setAttribute('aria-selected',v==='fav');
  if(v==='fav'){showSetup(false);render()}
  else if(!cid)showSetup(true);
  else{showSetup(false);list.length?render():load()}
}
$('#t-home').onclick=()=>go('home');
$('#t-fav').onclick=()=>go('fav');
$('#gear').onclick=()=>showSetup(true);
$('#cancel').onclick=()=>showSetup(false);
$('#save').onclick=()=>{
  const v=$('#cid').value.trim();
  if(!v){toast('Вставьте client_id');return}
  cid=v;st.s('cid',cid);list=[];
  view='home';go('home');load();
};

const chips=$('#chips');
TAGS.forEach(([k,label])=>{
  const b=el('button','chip',label);b.type='button';
  b.setAttribute('aria-pressed',k===tag);
  b.onclick=()=>{
    tag=k;
    chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
    load();
  };
  chips.append(b);
});
let deb;
$('#q').oninput=e=>{clearTimeout(deb);deb=setTimeout(()=>{q=e.target.value.trim();load()},400)};

$('#t-fav').textContent='Избранное'+(favs.length?' · '+favs.length:'');
if(!cid)showSetup(true);else load();
</script>
</body>
</html>
