<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121214">
<title>Волна — бесплатная музыка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121214;--s1:#1c1c20;--s2:#26262c;--s3:#3a3a43;--tx:#f4f3f8;--mu:#a2a2b0;--ac:#ffdb4d;--on:#15130a;--hot:#ff5a6e;--navh:60px;--ph:84px;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);-webkit-tap-highlight-color:transparent}
body.has-player{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 88px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.fl{fill:currentColor}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:24px;height:24px}
.ib:hover{background:rgba(255,255,255,.07)}
.dk{display:none}

/* навигация */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(18,18,20,.97);border-top:1px solid var(--s2)}
.brand{display:none}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mu)}
.navb svg{width:24px;height:24px}
.navb[aria-current=page]{color:var(--ac)}

/* страницы */
main{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
h1.h{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:12px 0}
h2.sec{font-size:20px;font-weight:700;margin:24px 0 12px}
.note{color:var(--mu);padding:16px 0;margin:0}
.foot{font-size:13px;padding-top:24px}
.mu{color:var(--mu)}
.nm,.ar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-weight:500}
.ar{color:var(--mu);font-size:14px}
.du{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}

/* списки треков */
.row{display:flex;align-items:center;border-radius:12px}
.row:hover{background:var(--s1)}
.pl{flex:1;min-width:0;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:6px 4px 6px 6px;text-align:left}
.cv{width:52px;height:52px;border-radius:8px;background:var(--s2);object-fit:cover;display:block}
.mt{min-width:0}
.row.on .nm{color:var(--ac)}
.fav{color:var(--mu)}
.fav.on{color:var(--hot)}
.fav.on svg{fill:currentColor}
.mo{color:var(--mu)}

/* Моя музыка */
.hero{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:linear-gradient(135deg,#ff5a6e,#8a2be2 75%);cursor:pointer;width:100%;text-align:left}
.hero .ht{flex:1;min-width:0}
.hero .t1{font-size:22px;font-weight:700}
.hero .t2{opacity:.85;font-size:14px}
.pbtn{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;flex:none}
.pbtn svg{width:28px;height:28px}
.car{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cd{flex:none;width:128px;text-align:left}
.cd .cv{width:128px;height:128px;border-radius:12px;margin-bottom:6px}
.empty{padding:32px 8px;text-align:center;color:var(--mu)}
.empty svg{width:48px;height:48px;opacity:.5}

/* Поиск */
.sbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px}
.sin{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--s1);border-radius:14px;color:var(--mu)}
.sin svg{width:22px;height:22px;flex:none}
.sin input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--tx);outline:0}
.sin input::placeholder{color:var(--mu)}
.sin:focus-within{box-shadow:0 0 0 2px var(--ac)}
.genres{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gn{height:84px;border-radius:16px;padding:12px;text-align:left;font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25);display:flex;align-items:flex-end;transition:transform .15s}
.gn:hover{transform:scale(1.02)}
.gh{display:flex;align-items:center;gap:4px;margin:8px 0 4px}
.gh h2{margin:0;font-size:22px}

/* Ещё */
.card{background:var(--s1);border-radius:16px;padding:16px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:20px}
.card p{margin:0 0 12px}
.fld{width:100%;height:46px;border-radius:12px;border:0;background:var(--s2);color:var(--tx);padding:0 14px;margin:4px 0 8px;outline:0}
.fld:focus{box-shadow:0 0 0 2px var(--ac)}
.lbl{font-size:13px;color:var(--mu)}
.btn{height:44px;padding:0 20px;border-radius:12px;background:var(--ac);color:var(--on);font-weight:500;margin:8px 8px 0 0}
.btn.alt{background:var(--s2);color:var(--tx)}
.btn.dg{background:var(--s2);color:var(--hot)}
.prof{display:flex;align-items:center;gap:16px;padding:16px;background:var(--s1);border-radius:16px;margin:12px 0 16px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#ff8a3d);color:var(--on);display:grid;place-items:center;font-size:28px;font-weight:700;flex:none}
.mrow{display:flex;align-items:center;width:100%;padding:14px 12px;border-radius:12px;text-align:left;gap:12px}
.mrow:hover{background:var(--s1)}
.mrow .mt{flex:1}
.mrow .c2{color:var(--mu);display:grid}
.mrow .c2 svg{width:20px;height:20px}
.sh2{display:flex;align-items:center;gap:4px;margin-left:-8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--s2)}
.kv:last-child{border:0}
.pcv{width:52px;height:52px;border-radius:8px;background:var(--s2);overflow:hidden;display:grid;place-items:center;color:var(--mu);flex:none}
.pcv img{width:100%;height:100%;object-fit:cover}
.pcv svg{width:26px;height:26px}
.acts{display:flex;flex-wrap:wrap;margin:8px 0 12px}

/* мини-плеер */
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 8px);height:64px;background:var(--s2);border-radius:14px;display:none;align-items:center;overflow:hidden;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#mini.show{display:flex}
#open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 8px;height:100%;text-align:left}
#mini .cv{width:46px;height:46px}
.mid{display:flex;align-items:center}
.mc{display:flex;align-items:center}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ac)}
.js-shuf,.js-rep{color:var(--mu)}
.js-shuf[aria-pressed=true],.js-rep[aria-pressed=true]{color:var(--ac)}
.pp{width:44px;height:44px}

/* ползунки */
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--tx) var(--p,0%),#4a4a54 var(--p,0%));cursor:pointer;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx);opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb,#full input[type=range]::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--tx)}
input[type=range]::-moz-range-track{background:transparent}

/* полный плеер */
#full{position:fixed;inset:0;z-index:30;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;overflow:auto}
#full.open{transform:none;visibility:visible;transition:transform .3s ease}
.fin{display:flex;flex-direction:column;height:100%;max-width:440px;margin:0 auto}
.stage{flex:1;display:grid;place-items:center;min-height:0}
#fcv{width:min(78vw,340px);max-height:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;background:var(--s2)}
.info{display:flex;align-items:center;gap:4px;margin-top:16px}
.info>div{flex:1;min-width:0}
#fnm{font-size:22px;font-weight:700;letter-spacing:-.01em}
#far{color:var(--mu)}
#full .js-seek{width:100%;margin:16px 0 8px}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.big{width:68px;height:68px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center}
.big svg{width:32px;height:32px}
.fvol{display:none}
.lic{text-align:center;font-size:13px;margin-top:12px}

/* шторка и уведомление */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.shc{width:100%;max-width:480px;background:var(--s1);border-radius:20px 20px 0 0;padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px))}
.shc h3{margin:0;padding:4px 12px 8px;font-size:15px;color:var(--mu);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si{display:block;width:100%;text-align:left;padding:14px 12px;border-radius:12px}
.si:hover{background:var(--s2)}
.si.dg{color:var(--hot)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--s3);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw}

/* компьютер */
@media (min-width:900px){
  body{padding:0 0 32px 240px}
  body.has-player{padding-bottom:calc(var(--ph) + 32px)}
  #nav{top:0;right:auto;bottom:0;width:240px;height:auto;flex-direction:column;padding:24px 12px;border-top:0;border-right:1px solid var(--s2);background:var(--bg)}
  body.has-player #nav{bottom:var(--ph)}
  .brand{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;padding:0 12px 20px}
  .brand b{color:var(--ac)}
  .navb{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;font-size:16px;padding:12px;border-radius:12px;color:var(--tx)}
  .navb:hover{background:var(--s1)}
  .navb[aria-current=page]{background:var(--s2);color:var(--ac)}
  .wrap{padding:0 40px}
  h1.h{font-size:34px;margin:24px 0 16px}
  .genres{grid-template-columns:repeat(4,1fr)}
  .gn{height:100px}
  .cd{width:152px}.cd .cv{width:152px;height:152px}
  .dk{display:flex}
  .ib.dk{display:grid}
  #mini{left:0;right:0;bottom:0;height:var(--ph);border-radius:0;background:#17171a;border-top:1px solid var(--s2);box-shadow:none;padding:0 16px;grid-template-columns:minmax(0,1fr) minmax(300px,1.5fr) minmax(0,1fr);gap:16px}
  #mini.show{display:grid}
  #open{padding:0}
  #mini .cv{width:56px;height:56px}
  #bar{display:none}
  .mid{flex-direction:column;justify-content:center;gap:0}
  .mc{justify-content:center;gap:4px}
  .ms{align-items:center;gap:10px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
  .ms input{flex:1}
  .mr{justify-content:flex-end;align-items:center;gap:6px}
  .mr input{width:110px}
  #mini .pp{background:var(--ac);color:var(--on)}
  #mini .pp:hover{background:var(--ac)}
  .fvol{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px}
  .fvol input{width:140px}
  .shc{border-radius:20px;margin:auto}
  #sheet{align-items:center}
}
@media (prefers-reduced-motion:reduce){#full,#full.open{transition:none}.gn{transition:none}}
</style>
</head>
<body>
<nav id="nav" aria-label="Разделы">
  <div class="brand">Волна<b>.</b></div>
  <button class="navb" type="button" data-t="my" aria-current="page"></button>
  <button class="navb" type="button" data-t="search"></button>
  <button class="navb" type="button" data-t="more"></button>
</nav>

<main>
  <section id="v-my" class="wrap"></section>
  <section id="v-search" class="wrap" hidden>
    <div class="sbar"><label class="sin"><span id="sico"></span><input id="q" type="search" placeholder="Трек, исполнитель, жанр" aria-label="Поиск" autocomplete="off"></label></div>
    <div id="sres"></div>
  </section>
  <section id="v-more" class="wrap" hidden></section>
</main>

<div id="mini">
  <div id="bar"></div>
  <button id="open" type="button" aria-label="Открыть плеер">
    <img class="cv" id="mcv" alt="">
    <div class="mt"><div class="nm" id="mnm"></div><div class="ar" id="mar"></div></div>
  </button>
  <div class="mid">
    <div class="mc">
      <button class="ib dk js-shuf" type="button" aria-label="Вперемешку" aria-pressed="false"></button>
      <button class="ib dk js-prev" type="button" aria-label="Предыдущий"></button>
      <button class="ib pp js-pp" type="button" aria-label="Играть"></button>
      <button class="ib js-next" type="button" aria-label="Следующий"></button>
      <button class="ib dk js-rep" type="button" aria-label="Повтор" aria-pressed="false"></button>
    </div>
    <div class="ms dk"><span class="js-t1">0:00</span><input type="range" class="js-seek" min="0" max="0" step="1" value="0" aria-label="Перемотка"><span class="js-t2">0:00</span></div>
  </div>
  <div class="mr dk">
    <button class="ib js-mute" type="button" aria-label="Выключить звук"></button>
    <input type="range" class="js-vol" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
    <button class="ib" id="expand" type="button" aria-label="Развернуть плеер"></button>
  </div>
</div>

<section id="full" aria-label="Плеер">
  <div class="fin">
    <div><button class="ib" id="close" type="button" aria-label="Свернуть"></button></div>
    <div class="stage"><img id="fcv" alt=""></div>
    <div class="info">
      <div><div class="nm" id="fnm"></div><div class="ar" id="far"></div></div>
      <button class="ib fav" id="ffav" type="button"></button>
      <button class="ib mo" id="fmore" type="button" aria-label="Ещё"></button>
    </div>
    <input type="range" class="js-seek" min="0" max="0" step="1" value="0" aria-label="Перемотка">
    <div class="times"><span class="js-t1">0:00</span><span class="js-t2">0:00</span></div>
    <div class="ctl">
      <button class="ib js-shuf" type="button" aria-label="Вперемешку" aria-pressed="false"></button>
      <button class="ib js-prev" type="button" aria-label="Предыдущий"></button>
      <button class="big js-pp" type="button" aria-label="Играть"></button>
      <button class="ib js-next" type="button" aria-label="Следующий"></button>
      <button class="ib js-rep" type="button" aria-label="Повтор" aria-pressed="false"></button>
    </div>
    <div class="fvol"><button class="ib js-mute" type="button" aria-label="Выключить звук"></button><input type="range" class="js-vol" min="0" max="1" step="0.01" value="1" aria-label="Громкость"></div>
    <div class="lic"><a id="lic" href="https://www.jamendo.com" target="_blank" rel="noopener">Лицензия трека</a></div>
  </div>
</section>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const st={
  g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const S=p=>'<svg viewBox="0 0 24 24" class="st" aria-hidden="true">'+p+'</svg>';
const F=p=>'<svg viewBox="0 0 24 24" class="fl" aria-hidden="true">'+p+'</svg>';
const REP='<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>';
const IC={
  play:F('<path d="M8 5v14l11-7z"/>'),
  pause:F('<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'),
  next:F('<path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/>'),
  prev:F('<path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/>'),
  heart:S('<path d="M12 20.5l-1.4-1.3C5.4 14.5 2 11.4 2 7.6 2 4.5 4.4 2.5 7 2.5c1.7 0 3.4.8 5 2.6 1.6-1.8 3.3-2.6 5-2.6 2.6 0 5 2 5 5.1 0 3.8-3.4 6.9-8.6 11.6z"/>'),
  shuf:S('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),
  rep:S(REP),
  rep1:S(REP+'<path d="M11 10.5l1.5-1v5.5"/>'),
  vol:S('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>'),
  mute:S('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'),
  down:S('<path d="M6 9l6 6 6-6"/>'),
  up:S('<path d="M6 15l6-6 6 6"/>'),
  back:S('<path d="M15 5l-7 7 7 7"/>'),
  chev:S('<path d="M9 5l7 7-7 7"/>'),
  dots:F('<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>'),
  note:S('<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'),
  search:S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  more:F('<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>')
};
const GENRES=[['pop','Поп','#ff7aa2,#b44cff'],['rock','Рок','#ff6a3d,#b3122b'],['electronic','Электроника','#33d6ff,#5b4bff'],['hiphop','Хип-хоп','#ffd23f,#ff7a18'],['jazz','Джаз','#d4a62a,#7a3d1c'],['classical','Классика','#8fa3ff,#3a3f7a'],['ambient','Эмбиент','#5ef2c1,#127a8a'],['lounge','Лаунж','#ff9bd2,#7a4cff']];
const PAGE=30;

let cid=st.g('cid',''), favs=st.g('favs',[]), hist=st.g('hist',[]), pls=st.g('pls',[]);
let prof=st.g('prof',null);
if(!prof){prof={name:'Слушатель',since:Date.now(),plays:0};st.s('prof',prof)}
let vol=st.g('vol',1), rep=st.g('rep','off');
let tab='my', sub=null;
let queue=[], idx=-1, shuf=false, errs=0, srcK=0, dragging=false, toastT;
let sq='', stag='', sres=[], sMore=false, sBusy=false, sErr='', req=0, deb;
const au=new Audio();
au.preload='auto';au.volume=vol;au.loop=rep==='one';

/* ---------- свои файлы (хранятся в браузере, IndexedDB) ---------- */
const AUD=/\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|webm)$/i;
let mine=[], objURL='';
const DB={
  open(){return this._p||(this._p=new Promise((res,rej)=>{
    const r=indexedDB.open('volna',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }))},
  async tx(mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));
      t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
    });
  },
  put(rec){return this.tx('readwrite',s=>s.put(rec))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  all(){return this.tx('readonly',s=>s.getAll())},
  clear(){return this.tx('readwrite',s=>s.clear())}
};
async function loadMine(){
  try{const a=await DB.all();mine=(a||[]).map(({blob,...m})=>m).sort((x,y)=>y.added-x.added)}catch(e){mine=[]}
  if(tab==='my')renderMy();
}
function parseName(fn){
  const b=fn.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const m=b.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  return m?{artist:m[1].trim(),name:m[2].trim()}:{artist:'Неизвестный исполнитель',name:b};
}
function durOf(file){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),a=new Audio();let done=false;
    const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);res(isFinite(d)?Math.round(d):0)};
    a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);
    setTimeout(()=>fin(0),4000);a.src=u;
  });
}
async function addFiles(files){
  const arr=[...files].filter(f=>(f.type||'').startsWith('audio/')||AUD.test(f.name));
  if(!arr.length){toast('Выберите аудиофайлы (mp3, m4a, flac, ogg, wav)');return}
  let n=0;
  for(const f of arr){
    try{
      const p=parseName(f.name);
      const rec={id:'l'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:p.name,artist:p.artist,dur:await durOf(f),local:true,added:Date.now(),blob:f};
      await DB.put(rec);
      const {blob,...m}=rec;mine.unshift(m);n++;
    }catch(e){toast('Не удалось сохранить файл: '+f.name)}
  }
  if(n){toast('Добавлено: '+n);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  if(tab==='my')renderMy();
}
function pickFiles(){
  const i=el('input');i.type='file';i.multiple=true;i.accept='audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav';
  i.onchange=()=>addFiles(i.files);i.click();
}
async function removeLocal(t){
  try{await DB.del(t.id)}catch(e){}
  mine=mine.filter(x=>x.id!==t.id);favs=favs.filter(x=>x.id!==t.id);hist=hist.filter(x=>x.id!==t.id);
  pls.forEach(p=>{p.tracks=p.tracks.filter(x=>x.id!==t.id)});save();
  if(cur()&&cur().id===t.id){au.pause();au.removeAttribute('src')}
  toast('Файл удалён');
  if(tab==='my')renderMy();else if(tab==='more')renderMore();
}

/* ---------- Jamendo ---------- */
async function api(params){
  const u=new URL('https://api.jamendo.com/v3.0/tracks/');
  const p={client_id:cid,format:'json',limit:PAGE,audioformat:'mp32',imagesize:300,...params};
  for(const k in p)if(p[k]!=='')u.searchParams.set(k,p[k]);
  const r=await fetch(u.toString());
  const d=await r.json();
  if(!d.headers||d.headers.status!=='success')throw new Error((d.headers&&d.headers.error_message)||'ошибка ответа');
  return d.results.filter(t=>t.audio).map(t=>{
    const a=https(t.audio),srcs=[a];
    if(/format=mp32/.test(a))srcs.push(a.replace('format=mp32','format=mp31'));
    if(t.audiodownload&&t.audiodownload_allowed!==false)srcs.push(https(t.audiodownload));
    return{id:String(t.id),name:t.name,artist:t.artist_name,dur:+t.duration,img:https(t.image),src:a,srcs,lic:t.license_ccurl,url:t.shareurl};
  });
}

/* ---------- Поиск ---------- */
async function runSearch(more){
  if(!cid){renderSearch();return}
  const n=++req;
  if(!more)sres=[];
  sBusy=true;sErr='';renderSearch();
  try{
    const p={offset:more?sres.length:0};
    if(sq)p.search=sq;else p.order='popularity_week';
    if(stag)p.tags=stag;
    const r=await api(p);
    if(n!==req)return;
    sres=more?sres.concat(r):r;sMore=r.length>=PAGE;
  }catch(e){
    if(n!==req)return;
    sErr='Не получилось загрузить: '+e.message+'. Проверьте client_id и подключение к интернету.';
  }
  sBusy=false;renderSearch();
}
function renderSearch(){
  const box=$('#sres');box.textContent='';
  if(!cid){box.append(setupCard());return}
  const def=!sq&&!stag;
  if(def){
    box.append(el('h2','sec','Жанры'));
    const g=el('div','genres');
    GENRES.forEach(([k,l,c])=>{
      const b=el('button','gn');b.type='button';b.style.background='linear-gradient(135deg,'+c+')';b.textContent=l;
      b.onclick=()=>{stag=k;sq='';$('#q').value='';runSearch();window.scrollTo(0,0)};
      g.append(b);
    });
    box.append(g,el('h2','sec','Популярное сейчас'));
  }else{
    const h=el('div','gh');
    if(stag){
      h.append(btn('ib',IC.back,'Назад',()=>{stag='';sq='';$('#q').value='';runSearch()}));
      const g=GENRES.find(x=>x[0]===stag);
      h.append(el('h2',null,g?g[1]:stag));
    }else h.append(el('h2','sec','Результаты'));
    box.append(h);
  }
  if(sErr)box.append(el('p','note',sErr));
  else if(sBusy&&!sres.length)box.append(el('p','note','Загружаю…'));
  else if(!sres.length)box.append(el('p','note','Ничего не найдено. Попробуйте другой запрос.'));
  else{const l=el('div','list');l.append(rows(sres));box.append(l)}
  if(sMore&&!sBusy&&!sErr)box.append(tbtn('btn alt','Показать ещё',()=>runSearch(true)));
  if(sq&&!sBusy)box.append(extCard(sq));
  box.append(el('p','note foot','Музыка с Jamendo. Треки выходят под лицензиями Creative Commons: ссылка на лицензию есть в полном плеере.'));
}

}
function exportData(){
  const blob=new Blob([JSON.stringify({v:1,favs,hist,pls,prof})],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='volna-backup.json';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
  const i=el('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{
    try{
      const d=JSON.parse(await i.files[0].text());
      if(Array.isArray(d.favs))favs=d.favs;if(Array.isArray(d.hist))hist=d.hist;if(Array.isArray(d.pls))pls=d.pls;
      if(d.prof&&typeof d.prof==='object')prof={...prof,...d.prof};
      save();toast('Данные загружены');renderMore();
    }catch(e){toast('Не удалось прочитать файл')}
  };
  i.click();
}

/* ---------- плеер ---------- */
function play(arr,i){queue=arr.slice();idx=i;errs=0;start()}
function playAu(){
  const p=au.play();
  if(p&&p.catch)p.catch(e=>{
    if(e.name==='NotAllowedError')toast('Браузер заблокировал звук. Нажмите Play ещё раз.');
    else if(e.name!=='AbortError'&&e.name!=='NotSupportedError')toast('Ошибка звука: '+e.name);
  });
}
function setSrc(t,k){
  srcK=k;
  if(t.local){
    au.pause();
    DB.get(t.id).then(rec=>{
      if(cur()!==t)return;
      if(!rec||!rec.blob){toast('Файл не найден. Добавьте его заново.');return}
      if(objURL)URL.revokeObjectURL(objURL);
      objURL=URL.createObjectURL(rec.blob);au.src=objURL;playAu();
    }).catch(()=>toast('Не удалось открыть файл'));
    return;
  }
  const list=t.srcs&&t.srcs.length?t.srcs:[t.src];
  au.src=list[k];
  playAu();
}
function start(){
  const t=cur();if(!t)return;
  setSrc(t,0);
  $('#mini').classList.add('show');document.body.classList.add('has-player');
  [$('#mcv'),$('#fcv')].forEach(i=>{if(t.img)i.src=t.img;else i.removeAttribute('src')});
  $('#mnm').textContent=$('#fnm').textContent=t.name;
  $('#mar').textContent=$('#far').textContent=t.artist;
  $('#lic').href=t.lic||t.url||'https://www.jamendo.com';
  $('#lic').parentElement.hidden=!!t.local;
  hist=[t,...hist.filter(x=>x.id!==t.id)].slice(0,50);
  prof.plays=(prof.plays||0)+1;save();
  $$('.row').forEach(r=>r.classList.toggle('on',r.dataset.id===t.id));
  tick();sync();
  if('mediaSession' in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist,artwork:t.img?[{src:t.img,sizes:'300x300'}]:[]})}catch(e){}
  }
}
function sync(){
  const p=!au.paused;
  $$('.js-pp').forEach(b=>{b.innerHTML=p?IC.pause:IC.play;b.setAttribute('aria-label',p?'Пауза':'Играть')});
  $$('.js-shuf').forEach(b=>{b.innerHTML=IC.shuf;b.setAttribute('aria-pressed',shuf)});
  $$('.js-rep').forEach(b=>{b.innerHTML=rep==='one'?IC.rep1:IC.rep;b.setAttribute('aria-pressed',rep!=='off');b.setAttribute('aria-label',rep==='off'?'Повтор выключен':rep==='all'?'Повторять всё':'Повторять трек')});
  const m=au.muted||au.volume===0;
  $$('.js-mute').forEach(b=>{b.innerHTML=m?IC.mute:IC.vol;b.setAttribute('aria-label',m?'Включить звук':'Выключить звук')});
  $$('.js-vol').forEach(i=>{i.value=m?0:vol;setP(i)});
  const t=cur();if(!t)return;
  const f=$('#ffav');
  f.dataset.id=t.id;f.className='ib fav'+(isFav(t)?' on':'');
  f.innerHTML=IC.heart;
  f.setAttribute('aria-label',isFav(t)?'Убрать из избранного':'В избранное');
}
function setP(i){const mx=+i.max||1;i.style.setProperty('--p',(Math.min(1,i.value/mx)*100)+'%')}
function tick(){
  const d=au.duration||(cur()&&cur().dur)||0,c=au.currentTime||0;
  $('#bar').style.width=d?(c/d*100)+'%':'0';
  $$('.js-seek').forEach(s=>{if(dragging&&document.activeElement===s)return;s.max=d;s.value=c;setP(s)});
  $$('.js-t1').forEach(e=>e.textContent=fmt(c));
  $$('.js-t2').forEach(e=>e.textContent=fmt(d));
}
function step(d){
  if(!queue.length)return;
  if(shuf&&queue.length>1){let n;do n=Math.floor(Math.random()*queue.length);while(n===idx);idx=n}
  else idx=(idx+d+queue.length)%queue.length;
  errs=0;start();
}
function toggle(){if(!cur())return;au.paused?playAu():au.pause()}
function cycleRep(){rep=rep==='off'?'all':rep==='all'?'one':'off';au.loop=rep==='one';st.s('rep',rep);sync()}
function setVol(v){vol=Math.max(0,Math.min(1,v));au.volume=vol;au.muted=false;st.s('vol',vol);sync()}

au.onplay=au.onpause=sync;
au.onplaying=()=>{errs=0};
au.ontimeupdate=au.onloadedmetadata=au.ondurationchange=tick;
au.onvolumechange=sync;
au.onended=()=>{
  if(rep==='off'&&!shuf&&idx===queue.length-1){sync();return}
  step(1);
};
au.onerror=()=>{
  const t=cur();if(!t)return;
  const list=t.srcs&&t.srcs.length?t.srcs:[t.src];
  if(srcK<list.length-1){setSrc(t,srcK+1);return}
  if(++errs>3){toast('Не удаётся воспроизвести (код '+(au.error?au.error.code:'?')+'). Проверьте подключение и client_id.');return}
  toast('Трек не воспроизводится, переключаю');step(1);
};

/* кнопки плеера */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('js-pp'))toggle();
  else if(b.classList.contains('js-next'))step(1);
  else if(b.classList.contains('js-prev')){if(au.currentTime>3)au.currentTime=0;else step(-1)}
  else if(b.classList.contains('js-shuf')){shuf=!shuf;sync()}
  else if(b.classList.contains('js-rep'))cycleRep();
  else if(b.classList.contains('js-mute')){au.muted=!au.muted;if(!au.muted&&vol===0)setVol(.5);sync()}
});
$$('.js-seek').forEach(s=>{
  s.addEventListener('pointerdown',()=>{dragging=true});
  s.addEventListener('pointerup',()=>{dragging=false});
  s.addEventListener('input',()=>{au.currentTime=+s.value;setP(s)});
});
$$('.js-vol').forEach(i=>i.addEventListener('input',()=>setVol(+i.value)));
$('#ffav').onclick=()=>{if(cur())toggleFav(cur())};
$('#fmore').onclick=()=>{if(cur())trackMenu(cur())};
$('#open').onclick=$('#expand').onclick=()=>$('#full').classList.add('open');
$('#close').onclick=()=>$('#full').classList.remove('open');

if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  const h=(n,f)=>{try{m.setActionHandler(n,f)}catch(e){}};
  h('play',()=>playAu());h('pause',()=>au.pause());
  h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
  h('seekto',d=>{if(d.seekTime!=null)au.currentTime=d.seekTime});
}

/* клавиатура (компьютер) */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();$('#full').classList.remove('open');return}
  const tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='BUTTON'&&e.key===' '))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===' '){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.shiftKey?step(1):au.currentTime=Math.min(au.duration||1e9,au.currentTime+5)}
  else if(e.key==='ArrowLeft'){e.shiftKey?step(-1):au.currentTime=Math.max(0,au.currentTime-5)}
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(vol+.05)}
  else if(e.key==='ArrowDown'){e.preventDefault();setVol(vol-.05)}
});

/* ---------- вкладки ---------- */
const TABS={my:['Моя музыка',IC.note],search:['Поиск',IC.search],more:['Ещё',IC.more]};
$$('.navb').forEach(b=>{
  const t=TABS[b.dataset.t];
  b.innerHTML=t[1]+'<span>'+t[0]+'</span>';
  b.onclick=()=>{if(b.dataset.t==='more'&&tab==='more')sub=null;setTab(b.dataset.t)};
});
function setTab(t){
  tab=t;
  $$('.navb').forEach(b=>{if(b.dataset.t===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  ['my','search','more'].forEach(k=>$('#v-'+k).hidden=k!==t);
  if(t==='my')renderMy();
  else if(t==='more')renderMore();
  else if(!sres.length&&!sBusy)runSearch();
  else renderSearch();
  window.scrollTo(0,0);
}
$('#sico').innerHTML=IC.search;
$('#q').oninput=e=>{
  clearTimeout(deb);
  deb=setTimeout(()=>{sq=e.target.value.trim();if(sq)stag='';runSearch()},400);
};
$('#close').innerHTML=IC.down;
$('#expand').innerHTML=IC.up;
$('#fmore').innerHTML=IC.dots;
$$('.js-prev').forEach(b=>b.innerHTML=IC.prev);
$$('.js-next').forEach(b=>b.innerHTML=IC.next);
sync();
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{
  e.preventDefault();
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){if(tab!=='my')setTab('my');addFiles(e.dataTransfer.files)}
});
setTab((!cid||(!favs.length&&!hist.length))?'search':'my');
loadMine();
</script>
</body>
</html>
